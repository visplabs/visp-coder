# SonarQube Cloud, run from CI (.github/workflows/ci.yml, job `sonar`) with the merged coverage.
# Automatic analysis must be off in SonarQube Cloud, or the CI scan is refused.
sonar.projectKey=visplabs_visp-coder
sonar.organization=visplabs
sonar.sources=src,scripts,bench
sonar.tests=tests
# Deliberately unsafe or generated code: benchmark reference apps and fixtures, golden snapshots.
sonar.exclusions=bench/reference/**,bench/fixtures/**,dist/**,coverage/**
sonar.test.exclusions=tests/fixtures/**,tests/golden/**
# Coverage is measured for src/ only (coverage/merged/lcov.info, from scripts/ci/coverage-merge.mjs).
sonar.javascript.lcov.reportPaths=coverage/merged/lcov.info
sonar.coverage.exclusions=scripts/**,bench/**
sonar.cpd.exclusions=tests/**
