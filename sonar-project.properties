# SonarQube Cloud, run from CI (.github/workflows/ci.yml, job `sonar`) with the merged coverage.
# Automatic analysis must be off in SonarQube Cloud, or the CI scan is refused.
sonar.projectKey=visplabs_visp-coder
sonar.organization=visplabs
sonar.sources=src,scripts,bench
sonar.tests=tests
# Deliberately unsafe or generated code: benchmark reference apps and fixtures, golden snapshots.
sonar.exclusions=bench/reference/**,bench/fixtures/**,dist/**,coverage/**
sonar.test.exclusions=tests/fixtures/**,tests/golden/**
# Coverage is measured for src/ only (coverage/merged/lcov.info, from scripts/ci/coverage-merge.mjs).
sonar.javascript.lcov.reportPaths=coverage/merged/lcov.info
sonar.coverage.exclusions=scripts/**,bench/**
sonar.cpd.exclusions=tests/**
# S4036 (a command found through PATH) is not enforced in scripts/ and bench/: they are developer
# tools run only on the owner's machine and in CI, where anyone able to write to a PATH directory
# already owns the account, and absolute paths would break macOS, Windows and the runners. src/,
# which ships to users, keeps the rule.
sonar.issue.ignore.multicriteria=pathScripts,pathBenchJs,pathBenchPy
sonar.issue.ignore.multicriteria.pathScripts.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathScripts.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.pathBenchJs.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathBenchJs.resourceKey=bench/**
sonar.issue.ignore.multicriteria.pathBenchPy.ruleKey=python:S4036
sonar.issue.ignore.multicriteria.pathBenchPy.resourceKey=bench/**
