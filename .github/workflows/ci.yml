name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Everything `pnpm release:check` runs, split into jobs that run side by side. Each job runs
# the script it replaces, so keep the two in step when a script changes. The last job, `check`,
# is the single result to require on a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trust-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # The declaration build needs about 2 GB of heap, at the default limit of Node 22 on
      # the 7 GB macOS runner, where it ran out of memory.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check confined storage and transactional installation
        run: >-
          pnpm exec vitest run
          tests/unit/core/input.test.ts
          tests/unit/core/paths.test.ts
          tests/unit/core/fs.test.ts
          tests/unit/core/file-transaction.test.ts
          tests/unit/core/state-lock.test.ts
          tests/integration/state-concurrency.test.ts
          tests/unit/telemetry
          tests/unit/runner
          tests/unit/cli/input-boundary.test.ts
          tests/unit/graph/extract/tsconfig.test.ts
          tests/unit/graph/store/confinement.test.ts
          tests/unit/graph/walker/walk.test.ts
          tests/unit/harness/activation.test.ts
          tests/unit/harness/install-transaction.test.ts
          tests/integration/windows-native-spawn.test.ts
          tests/unit/workflow/transaction-fault-injection.test.ts
          --maxWorkers=2 --minWorkers=1

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip

  # `pnpm test` in four parts. A shard runs whole test files, so every test still runs once.
  test:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  browser:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:browser

  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:qualification

  trust-coverage:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:coverage:trust

  # Includes a tarball consumer install, so CI and publishing exercise the
  # same packaged binary rather than trusting the repository's live dist.
  package:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:package

  check:
    if: always()
    needs: [trust-boundary, static, test, browser, qualification, trust-coverage, package]
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false ]
